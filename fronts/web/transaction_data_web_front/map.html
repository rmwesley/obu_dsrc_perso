<head>
  <title>Transactions Map</title>
  <link rel="icon" href="address-icon.svg">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</head>
<body>
  <p>This map only works for CCC Toll Domains (AID 20)!!</p>
  <p>EFC DSRC Transactions (AID 1) do not contain position data...</p>
  <div id="map" style="height: 320px; width: 480px;">
  </div>

  <div id="input_zone">
    <input id="device_id_input" type="search"></input>
    <button id="search_button" onclick="trigger_search_from_input()">Search</button>
    <script>
      device_id_input.select()

      device_id_input.addEventListener("keyup", function(event) {
        if (event.keyCode === 13) {
          search_button.click();
        }
      });
    </script>
  </div>

  <script src="js/map/dsrc_transactions_leaflet_osm.js"></script>

  <script></script>
</body>
