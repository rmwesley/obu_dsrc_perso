<head>
  <title>Transactions Map</title>
  <link rel="icon" href="address-icon.svg">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</head>
<body>
  <div id="map" style="height: 320px; width: 480px;">
  </div>

  <div id="input_zone">
    <input id="device_id_input" type="search"></input>
    <button id="search_button" onclick="trigger_search_from_input()">Search</button>
    <script>
      device_id_input.select()

      device_id_input.addEventListener("keyup", function(event) {
        if (event.keyCode === 13) {
          search_button.click();
        }
      });
    </script>
  </div>

  <script>
    zoom = 13;
    x = 45.7593685;
    y = 4.8557787;

    // var map = L.map('map');
    var map = L.map('map').setView([x, y], zoom);
  
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    var axxes_marker = L.marker([x, y]);
    axxes_marker.addTo(map);
  </script>

  <script>
    function trigger_search_from_input(){
      obu_id = device_id_input.value;
      send_http_req_and_display_data(obu_id);
    }

    function send_http_req_to_get_data(obu_id){
      obu_transaction_data_req = new Request('/dsrc-transactions/data/obus/' + obu_id)
      return fetch(obu_transaction_data_req)
        .then((response) => response.json())
    }
    function send_http_req_and_display_data(obu_id){
      send_http_req_to_get_data(obu_id)
        .then((response_body) => {
          response_body.forEach(transaction_data => {
            console.log(transaction_data);
          });
        })
      }
  </script>
</body>
