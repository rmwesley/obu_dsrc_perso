<head>
  <title>Transactions Map</title>
  <link rel="icon" href="address-icon.svg">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://pfau-software.de/json-viewer/dist/iife/index.js"></script>
</head>

<body>
  <style>
    #options{
      display: inline-block;
      width: 300px;
      vertical-align: top;
      background-color: #d0d0ff;
      padding: 0 10px;
    }
    .option_item{
      text-align: center;
      box-sizing: border-box;
      display: block;
      padding: 10px;
      width: 100%;
      margin-bottom: 13px;
    }
    .checkbox_to_button{
      display: inline-block;
      border: solid;
      border-radius: 4px;
      border-color: #5050ff;
    }
    .checkbox_to_button > input[type=checkbox]{
      display: none;
    }
    .checkbox_to_button:has(> input:checked){
      background-color: #5050ff;
    }
  </style>
  <div id="map_section">
    <p>This map displays OBU GNSS fix positions, so it only truly works for CCC Toll Domains (AID 20)!!</p>
    <p>For EFC DSRC Transactions (AID 1) we try to interpolate/mapmatch the position data...</p>
    <div id="map" style="height: 768px; width: 960px; display: inline-block;">
    </div>

    <div id="options">
      <p class="option_item" style="text-align: center;">Options</p>
      <div class="option_item" id="checkboxes">
        <input id="interpolate_positions_checkbox" type="checkbox" name="interpolate_positions_checkbox" checked/>
        <label for="interpolate_positions_checkbox">Interpolate missing GNSS fix positions</label>
      </div>

      <input class="option_item" id="search_start_time" type="datetime-local" name="search_start_time" min="2025-07-20T00:00"/>
      <input class="option_item" id="search_end_time" type="datetime-local" name="search_end_time" min="2025-07-20T00:00"/>

      <input class="option_item" id="device_id_input" type="search">
      <button class="option_item" id="search_button" onclick="trigger_search_from_input()">Search</button>
      <button class="option_item" id="clear_map_button" onclick="clear_obu_transactions_layer_on_leaflet_map()">Clear Map</button>

      <label id="rse_position_linker_checkbutton" class="option_item checkbox_to_button" for="link_position_checkbox">
        <input id="link_position_checkbox" type="checkbox" name="link_position_checkbox" unchecked/>
        Link GPS to RSE
      </label>

      <script>
        device_id_input.select()

        device_id_input.addEventListener("keyup", function(event) {
          if (event.keyCode === 13) {
            search_button.click();
          }
        });

        current_datetime = new Date();
        yesterday_datetime_milliseconds = current_datetime - 86400000;
        yesterday_datetime = new Date(yesterday_datetime_milliseconds)

        search_end_time.value = current_datetime.toLocaleString('sv-SE').replace(' ', 'T');
        search_start_time.value = yesterday_datetime.toLocaleString('sv-SE').replace(' ', 'T');
      </script>
    </div>
  </div>
  <script src="js/map/dsrc_transactions_leaflet_osm.js"></script>
  <script src="js/map/link_gps_position.js"></script>
</body>
