<head>
  <title>Search OBU Transactions</title>
  <link rel="icon" href="pass-fail-icon-scorecard-icon-svg.png">
</head>
<body>
  <div id="input_zone">
    <input id="hex_eq_obu_id_input" placeholder="Hex equOBUId" type="search"></input>
    <button id="hex_eq_obu_id_search_button" onclick="trigger_search_transaction_info_from_hex_obu_id_input()">Search</button>
    <script>
      hex_eq_obu_id_input.select()

      hex_eq_obu_id_input.addEventListener("keyup", function(event) {
        if (event.keyCode === 13) {
          hex_eq_obu_id_search_button.click();
        }
      });
    </script>
    <input id="dec_eq_obu_id_input" placeholder="Dec equOBUId" type="search"></input>
    <button id="dec_eq_obu_id_search_button" onclick="trigger_search_transaction_info_from_dec_obu_id_input()">Search</button>
    <script>
      dec_eq_obu_id_input.addEventListener("keyup", function(event) {
        if (event.keyCode === 13) {
          dec_eq_obu_id_search_button.click();
        }
      });
    </script>
  </div>

  <div id="transactions_info">
    <table id="transactions_table" style="border: 1px">
      <thead>
        <tr style="background-color: green">
          <th scope="col">Transaction ID</th>
          <th scope="col">personalAccountNumber</th>
          <th scope="col">equOBUId</th>
          <th scope="col">creation_time</th>
          <th scope="col">last_update_timestamp</th>
        </tr>
      </thead>
    </table>
    <dialog id="transaction_data_display">
      <pre id="transaction_data_dialog_display_content"></pre>
    </dialog>
  </div>

  <script type="text/javascript" src="js/search/get_transaction_info.js"></script>

  <script type="text/javascript" src="js/search/get_and_display_transaction_data.js"></script>
</body>
