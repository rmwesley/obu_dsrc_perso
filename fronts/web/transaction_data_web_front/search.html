<head>
  <title>Search OBU Transactions</title>
  <link rel="icon" href="pass-fail-icon-scorecard-icon-svg.png">
</head>
<body>
  <div id="input_zone">
    <input id="device_id_input" type="search"></input>
    <button id="search_button" onclick="trigger_search_transaction_info_from_input()">Search</button>
    <script>
      device_id_input.select()

      device_id_input.addEventListener("keyup", function(event) {
        if (event.keyCode === 13) {
          search_button.click();
        }
      });
    </script>
  </div>

  <div id="transactions_info">
    <table id="transactions_table" style="border: 1px">
      <thead>
        <tr style="background-color: green">
          <th scope="col">Transaction ID</th>
          <th scope="col">personalAccountNumber</th>
          <th scope="col">equOBUId</th>
          <th scope="col">creation_time</th>
          <th scope="col">last_update_timestamp</th>
        </tr>
      </thead>
    </table>
    <dialog id="transaction_data_display">
      <pre id="transaction_data_dialog_display_content"></pre>
    </dialog>
  </div>

  <script type="text/javascript" src="get_transaction_info.js"></script>

  <script type="text/javascript" src="get_and_display_transaction_data.js"></script>
</body>
