<head>
  <title>Search OBU Transactions</title>
  <link rel="icon" href="pass-fail-icon-scorecard-icon-svg.png">
</head>
<body>
  <div>
    <input id="device-identifier" type="search"></input>
    <button id="search-button" onclick="get_device_details()">Search</button>
  </div>
  <table id="transactions-list" style="border: 1px">
    <thead>
      <tr style="background-color: green">
        <th scope="col">Transaction ID</th>
        <th scope="col">personalAccountNumber</th>
        <th scope="col">equOBUId</th>
        <th scope="col">creation_time</th>
        <th scope="col">last_update_timestamp</th>
      </tr>
    </thead>
  </table>
  <script>

    document.getElementById('device-identifier').addEventListener("keyup", function(event) {
      if (event.keyCode === 13) {
        document.getElementById("search-button").click();
      }
    });

    function get_device_details(){
      transactions_table = document.getElementById("transactions-list")
      obu_id = document.getElementById('device-identifier').value
      obu_transaction_data_req = new Request('/dsrc-transactions/data/obus/' + obu_id)
      fetch(obu_transaction_data_req)
        .then((response) => response.json())
        .then((response_body) => {
          // console.log(response_body)
          response_body.forEach(transaction_data => {
            let new_row = transactions_table.insertRow(-1)
            key_list = [
              '_id',
              'personalAccountNumber',
              'equOBUId',
              'creation_time',
              'last_update_timestamp',
            ]
            key_list.forEach((key) => {
              value = transaction_data[key]

              new_cell = new_row.insertCell(-1)
              text_value = document.createTextNode(value)
              new_cell.appendChild(text_value)
            })
          });
        })
    }
  </script>
</body>
