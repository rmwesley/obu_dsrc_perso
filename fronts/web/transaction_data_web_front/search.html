<head>
  <title>Search OBU Transactions</title>
  <link rel="icon" href="pass-fail-icon-scorecard-icon-svg.png">
</head>
<body>
  <div>
    <input id="device_id_input" type="search"></input>
    <button id="search_button" onclick="trigger_search_from_input()">Search</button>
  </div>
  <table id="transactions_table" style="border: 1px">
    <thead>
      <tr style="background-color: green">
        <th scope="col">Transaction ID</th>
        <th scope="col">personalAccountNumber</th>
        <th scope="col">equOBUId</th>
        <th scope="col">creation_time</th>
        <th scope="col">last_update_timestamp</th>
      </tr>
    </thead>
  </table>
  <script>
    device_id_input.select()

    device_id_input.addEventListener("keyup", function(event) {
      if (event.keyCode === 13) {
        search_button.click();
      }
    });

    function trigger_search_from_input(){
      obu_id = device_id_input.value
      send_http_req_to_display_data(obu_id)
    }

    function send_http_req_to_get_data(obu_id){
      obu_transaction_data_req = new Request('/dsrc-transactions/data/obus/' + obu_id)
      return fetch(obu_transaction_data_req)
        .then((response) => response.json())
    }
    function send_http_req_to_display_data(obu_id){
      send_http_req_to_get_data(obu_id)
        .then((response_body) => {
          // console.log(response_body)
          response_body.forEach(transaction_data => {
            let new_row = transactions_table.insertRow(-1)
            key_list = [
              '_id',
              'personalAccountNumber',
              'equOBUId',
              'creation_time',
              'last_update_timestamp',
            ]
            key_list.forEach((key) => {
              value = transaction_data[key]

              new_cell = new_row.insertCell(-1)
              text_value = document.createTextNode(value)
              new_cell.appendChild(text_value)
            })
          });
        }
      )
    }
  </script>
</body>
