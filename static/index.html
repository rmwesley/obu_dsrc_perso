<script type="importmap">
  {
    "imports": {
      "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.js"
    }
  }
  </script>
  
  <title>Beacon Manager Interface</title>
  <div>{{ message }}</div>
  
  <div id="app">
    <div>
      <p>Beacon is stopped!</p>
      <button @click="changeToTransparent">Change mode to Transparent</button>
      <button @click="stopBeacon">Change mode to Stopped</button>
    </div>
    <div>
      <p>Beacon is in transparent mode!</p>
      <button @click="initializeCloseTransaction">Initialize and close transaction</button>
      <button @click="initialize">Initialize transaction</button>
    </div>
    <div>
      <p>Transaction in Progress!</p>
      <button @click="closeTransaction">Close Transaction</button> <!-- Add this button -->
      <div>
        <button @click="efcGet">GET</button>
        <button @click="efcSet">SET</button>
        <button @click="efcAction">ACTION</button>
      </div>
      <div>
        <h3>EFC Transaction</h3>
        <select v-model="toll_charger">
          <option v-for="charger in toll_chargers" :value="charger">{{ charger }}</option>
        </select>
        <select v-model="transaction_type">
          <option v-for="type in transaction_types" :value="type">{{ type }}</option>
        </select>
        <button @click="executeTransaction">Execute transaction</button>
      </div>
    </div>
    <div>
      <h3>Last VST</h3>
      <p>{{ last_vst }}</p>
    </div>
    <div>
      <h3>Beacon State</h3>
      <p>{{ beacon_state }}</p>
    </div>
  </div>
  
  <script type="module">
  import { createApp } from 'vue'
  
  createApp({
    data() {
      return {
        beacon_state: '',
        transaction_initialized: false,
        last_vst: '',
        toll_chargers: ['Charger1', 'Charger2'], // Example data
        transaction_types: ['CARDME', 'PISTA'], // Example data
        toll_charger: '',
        transaction_type: ''
      }
    },
    created() {
      this.getBeaconState()
      this.getLastVST()
    },
    methods: {
      async getBeaconState() {
        const response = await fetch('/beacon-state')
        const data = await response.json()
        this.beacon_state = data.beacon_state
      },
      async getLastVST() {
        const response = await fetch('/last-vst')
        const data = await response.json()
        this.last_vst = data.last_vst
      },
      async changeToTransparent() {
        await fetch('/change-mode', { method: 'POST', body: JSON.stringify({ mode: 1 }), headers: { 'Content-Type': 'application/json' } })
      },
      async stopBeacon(){
        const response = await fetch('/change-mode', { method: 'POST', body: JSON.stringify({ mode: 0 }), headers: { 'Content-Type': 'application/json' } })
        const data = await response.json()
        this.beacon_state = data.beacon_state
      },
      async initialize() {
        await fetch('/initialize-transaction', { method: 'POST' })
        this.transaction_initialized = true
        this.getLastVST()
      },
      async initializeCloseTransaction() {
        await fetch('/initialize-close-transaction', { method: 'POST' })
        this.getBeaconState()
        this.getLastVST()
      },
      async closeTransaction(){
        await fetch('/send-close-transaction-to-obu', { method: 'POST' })
        this.getBeaconState()
      },
      async efcGet() {
        // Implement EFC GET functionality
      },
      async efcSet() {
        // Implement EFC SET functionality
      },
      async efcAction() {
        // Implement EFC ACTION functionality
      },
      async executeTransaction() {
        // Implement transaction execution functionality
      }
    }
  }).mount('#app')
  </script>
